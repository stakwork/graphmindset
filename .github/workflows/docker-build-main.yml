name: Docker Build and Push to DockerHub (main)
env:
  DOCKER_CLI_EXPERIMENTAL: enabled

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    name: Build and push graphmindset image
    env:
      ACTIONS_ALLOW_UNSECURE_COMMANDS: true
    steps:
      - name: Check out from Git
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push
        run: |
          docker build --no-cache --label org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }} --label org.opencontainers.image.revision=${{ github.sha }} -t "${{ secrets.DOCKER_HUB_USER }}/graphmindset:main" .
          docker push "${{ secrets.DOCKER_HUB_USER }}/graphmindset:main"
      - name: Get image digest
        id: digest
        run: |
          echo "digest=$(docker buildx imagetools inspect "${{ secrets.DOCKER_HUB_USER }}/graphmindset:main" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
      # Verify with: gh attestation verify oci://index.docker.io/<namespace>/graphmindset@sha256:<digest> --owner stakwork
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: index.docker.io/${{ secrets.DOCKER_HUB_USER }}/graphmindset
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
